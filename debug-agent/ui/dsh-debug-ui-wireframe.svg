<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DSH debug UI/UX wireframe</title>
  <desc id="desc">A DSH session page with the debug status row placed directly above the existing message composer.</desc>

  <rect width="1200" height="760" fill="#f7f8fa"/>

  <!-- DSH session surface -->
  <rect x="24" y="24" width="884" height="712" rx="10" fill="#ffffff" stroke="#d9dee7"/>
  <rect x="24" y="24" width="884" height="64" rx="10" fill="#ffffff"/>
  <text x="48" y="52" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">run exec_command</text>
  <text x="48" y="73" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">DSH session</text>
  <text x="280" y="59" font-family="Arial, sans-serif" font-size="13" fill="#2563eb">Conversation</text>
  <text x="386" y="59" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">Trace</text>
  <rect x="780" y="40" width="100" height="30" rx="15" fill="#ffffff" stroke="#d9dee7"/>
  <text x="798" y="59" font-family="Arial, sans-serif" font-size="12" fill="#374151">Session log</text>
  <line x1="24" y1="88" x2="908" y2="88" stroke="#e5e7eb"/>

  <!-- Transcript -->
  <rect x="24" y="89" width="884" height="500" fill="#ffffff"/>
  <rect x="492" y="118" width="352" height="42" rx="21" fill="#edf4ff"/>
  <text x="514" y="144" font-family="Arial, sans-serif" font-size="13" fill="#1f3b67">/debug run exec_command({&quot;cmd&quot;:&quot;...&quot;})</text>

  <text x="218" y="204" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Assistant</text>
  <text x="278" y="204" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af">Tool call</text>
  <rect x="218" y="218" width="610" height="132" rx="10" fill="#fbfcfe" stroke="#e1e6ee"/>
  <rect x="238" y="238" width="70" height="22" rx="5" fill="#f1f5f9"/>
  <text x="257" y="253" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#64748b">CALL</text>
  <text x="330" y="254" font-family="monospace" font-size="13" fill="#24324a">exec_command</text>
  <line x1="238" y1="274" x2="808" y2="274" stroke="#e5e7eb"/>
  <text x="238" y="298" font-family="monospace" font-size="12" fill="#374151">{ "cmd": "Write-Output DEBUG_AGENT_OK" }</text>
  <rect x="238" y="315" width="570" height="1" fill="#e5e7eb"/>
  <text x="238" y="338" font-family="Arial, sans-serif" font-size="12" fill="#15803d">Tool result: DEBUG_AGENT_OK</text>

  <text x="218" y="396" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Assistant</text>
  <text x="278" y="396" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af">Final response</text>
  <text x="218" y="420" font-family="Arial, sans-serif" font-size="13" fill="#374151">Debug tool completed successfully.</text>

  <!-- The only new transient UI -->
  <rect x="122" y="604" width="700" height="48" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="149" cy="628" r="8" fill="#2563eb"/>
  <text x="171" y="633" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Debug replay</text>
  <text x="286" y="633" font-family="Arial, sans-serif" font-size="13" fill="#1e40af">3 / 7 executable steps</text>
  <text x="642" y="633" font-family="Arial, sans-serif" font-size="12" fill="#64748b">transient status</text>

  <!-- Existing composer -->
  <rect x="122" y="666" width="700" height="52" rx="26" fill="#ffffff" stroke="#cfd6e2"/>
  <circle cx="151" cy="692" r="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="146" y="697" font-family="Arial, sans-serif" font-size="17" fill="#64748b">+</text>
  <text x="180" y="697" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af">Send a message or /debug command</text>
  <circle cx="786" cy="692" r="17" fill="#2563eb"/>
  <text x="780" y="698" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">&#8593;</text>

  <!-- Annotation panel -->
  <rect x="946" y="126" width="220" height="470" rx="10" fill="#ffffff" stroke="#d9dee7"/>
  <text x="970" y="164" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172033">UI/UX boundary</text>
  <line x1="970" y1="180" x2="1142" y2="180" stroke="#e5e7eb"/>
  <circle cx="978" cy="214" r="5" fill="#2563eb"/>
  <text x="994" y="218" font-family="Arial, sans-serif" font-size="12" fill="#374151">New: compact status row</text>
  <text x="994" y="238" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">above composer only</text>
  <circle cx="978" cy="286" r="5" fill="#94a3b8"/>
  <text x="994" y="290" font-family="Arial, sans-serif" font-size="12" fill="#374151">Unchanged: transcript</text>
  <text x="994" y="310" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">real DSH tool cards</text>
  <circle cx="978" cy="358" r="5" fill="#94a3b8"/>
  <text x="994" y="362" font-family="Arial, sans-serif" font-size="12" fill="#374151">Unchanged: model page</text>
  <text x="994" y="382" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">no provider selector switch</text>
  <circle cx="978" cy="430" r="5" fill="#94a3b8"/>
  <text x="994" y="434" font-family="Arial, sans-serif" font-size="12" fill="#374151">Hidden when idle</text>
  <text x="994" y="454" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">no permanent debug chrome</text>
  <path d="M 946 520 C 900 520, 860 620, 822 626" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="970" y="530" font-family="Arial, sans-serif" font-size="11" fill="#2563eb">placement target</text>

  <text x="24" y="752" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Debug UI/UX wireframe - illustrative, not a DSH source change</text>
</svg>
